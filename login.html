<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Вход - Календарь мастера</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
        /* Стили для страницы входа */
        body {
            background: #FFFDF9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            margin: 0;
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        
        .login-container {
            max-width: 400px;
            width: 100%;
            background: #FFFDF9;
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
        }
        
        .login-container h1 {
            font-size: 24px;
            color: #008080;
            text-align: center;
            margin-bottom: 4px;
        }
        
        .login-container .subtitle {
            text-align: center;
            color: #7B8D8E;
            font-size: 14px;
            margin-bottom: 24px;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #37474F;
            margin-bottom: 4px;
        }
        
        .form-group .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #E0F2F1;
            border-radius: 12px;
            font-size: 16px;
            font-family: 'Montserrat', sans-serif;
            background: #FFF;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }
        
        .form-group .form-control:focus {
            border-color: #008080;
            box-shadow: 0 0 0 4px rgba(0, 128, 128, 0.08);
        }
        
        .form-group .form-control.error {
            border-color: #C62828;
        }
        
        .form-group .form-control.success {
            border-color: #2e7d32;
        }
        
        .form-group .hint {
            font-size: 12px;
            color: #7B8D8E;
            margin-top: 4px;
        }
        
        .form-group .hint.error {
            color: #C62828;
        }
        
        .form-group .hint.success {
            color: #2e7d32;
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Montserrat', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn:active:not(:disabled) {
            transform: scale(0.97);
        }
        
        .btn-primary {
            background: #008080;
            color: #FFF;
        }
        
        .btn-primary:hover:not(:disabled) {
            background: #006666;
        }
        
        .btn-secondary {
            background: #E0F2F1;
            color: #008080;
        }
        
        .hidden {
            display: none !important;
        }
        
        .spinner-small {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #E0F2F1;
            border-top: 2px solid #008080;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .divider {
            border: none;
            border-top: 1px solid #E0F2F1;
            margin: 20px 0;
        }
        
        .error-container {
            background: #FFEBEE;
            color: #C62828;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            text-align: center;
            font-weight: 500;
            font-size: 14px;
        }
        
        .error-container.hidden {
            display: none;
        }
        
        .network-error {
            background: #FFF3E0;
            color: #E65100;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            text-align: center;
            font-weight: 500;
            font-size: 14px;
            border: 1px solid #FFCC80;
        }
        
        .network-error.hidden {
            display: none;
        }
        
        .retry-btn {
            background: none;
            border: none;
            color: #008080;
            font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
            font-size: 14px;
            margin-left: 8px;
        }
        
        @media (max-width: 480px) {
            .login-container {
                padding: 24px 16px;
            }
        }
    </style>
</head>
<body>

<div class="login-container" id="loginContainer">
    <h1>📅 Календарь мастера</h1>
    <p class="subtitle">Войдите или зарегистрируйтесь</p>
    
    <!-- Ошибка сети -->
    <div id="networkError" class="network-error hidden">
        <span id="networkErrorText">⚠️ Ошибка подключения к серверу</span>
        <button class="retry-btn" id="retryBtn">Повторить</button>
    </div>
    
    <!-- Общая ошибка -->
    <div id="generalError" class="error-container hidden"></div>
    
    <!-- Шаг 1: Номер телефона -->
    <div id="stepPhone">
        <div class="form-group">
            <label for="phoneInput">Номер телефона</label>
            <input type="tel" id="phoneInput" class="form-control" placeholder="+375 (25) 123-45-67" maxlength="20" autocomplete="tel" />
            <div id="phoneHint" class="hint">Введите номер в формате +375 (XX) XXX-XX-XX</div>
        </div>
        <button class="btn btn-primary" id="nextBtn" disabled>Далее</button>
    </div>
    
    <!-- Шаг 2: Пароль / Регистрация -->
    <div id="stepAuth" class="hidden">
        <div id="authMessage" style="padding:12px;border-radius:8px;margin-bottom:16px;text-align:center;font-weight:500;"></div>
        
        <div class="form-group hidden" id="nameGroup">
            <label for="nameInput">Имя</label>
            <input type="text" id="nameInput" class="form-control" placeholder="Введите ваше имя" autocomplete="name" />
            <div id="nameHint" class="hint">Обязательное поле</div>
        </div>
        
        <div class="form-group">
            <label for="passwordInput" id="passwordLabel">Пароль</label>
            <input type="password" id="passwordInput" class="form-control" placeholder="Введите пароль" autocomplete="current-password" />
            <div id="passwordHint" class="hint">Минимум 4 символа</div>
        </div>
        
        <button class="btn btn-primary" id="authBtn" disabled>Войти</button>
    </div>
    
    <hr class="divider" />
    <div style="text-align:center;font-size:12px;color:#7B8D8E;">
        Вход защищён. Ваши данные в безопасности.
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/offline-sync.js"></script>

</body>
</html>
